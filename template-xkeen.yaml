# IDTBX MihoMo template for Keenetic + xkeen
# github.com/magiasegura/routing-public
#
# Consolidated rule-set structure — 16 rule-providers, 7 groups.
# All per-service categories (Apple/Microsoft/Steam/Twitch/Telegram/WhatsApp/
# Cloudflare/Roblox/etc.) are baked into the consolidated proxy/direct/games
# lists during build. The xkeen router does not need process rules — those
# are for desktop MihoMo only and live in release/proc-*.yaml.

port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7893
allow-lan: true
mode: rule
log-level: silent
ipv6: false
unified-delay: true
tcp-concurrent: true
client-fingerprint: chrome
external-controller: 0.0.0.0:9090
secret: admin
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS:  { ports: [443, 8443] }
    QUIC: { ports: [443] }
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - fc00::/7
    - fe80::/10

proxy-providers:
  sub:
    type: http
    url: <SUBSCRIPTION_URL>
    path: ./proxy_providers/base64.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      tfo: true
      mptcp: true
      udp: true
    header:
      User-Agent:
        - "Mihomo"
      x-hwid:
        - "<SYSTEM_NAME>"
      x-device-os:
        - "xKeen"
      x-ver-os:
        - "XKeen 2.0 Beta"
      x-device-model:
        - "<ROUTER_MODEL>"


proxy-groups:
  - name: VPN
    type: select
    include-all: true
  - name: YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    include-all: true
    proxies:
      - VPN
      - DIRECT
  - name: Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    type: select
    include-all: true
    proxies:
      - VPN
      - DIRECT
  - name: AI
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png
    type: select
    include-all: true
    proxies:
      - VPN
      - DIRECT
  - name: Games
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    include-all: true
    proxies:
      - DIRECT
      - VPN
  - name: Microsoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
    type: select
    include-all: true
    proxies:
      - DIRECT
      - VPN
  - name: Crypto
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bitcoin.png
    type: select
    include-all: true
    proxies:
      - VPN
      - DIRECT
  - name: RU-Custom
    type: select
    proxies:
      - DIRECT
      - VPN

rule-providers:
  # === IDTBX consolidated lists — mrs binary format (auto-updated every 4h) ===
  reject:             { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/reject.mrs",             path: ./ruleset/reject.mrs,             interval: 86400 }
  proxy:              { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/proxy.mrs",              path: ./ruleset/proxy.mrs,              interval: 86400 }
  direct:             { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/direct.mrs",             path: ./ruleset/direct.mrs,             interval: 86400 }
  microsoft:          { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/microsoft.mrs",          path: ./ruleset/microsoft.mrs,          interval: 86400 }
  youtube:            { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/youtube.mrs",            path: ./ruleset/youtube.mrs,            interval: 86400 }
  discord:            { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/discord.mrs",            path: ./ruleset/discord.mrs,            interval: 86400 }
  ai:                 { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/ai.mrs",                 path: ./ruleset/ai.mrs,                 interval: 86400 }
  games:              { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/games.mrs",              path: ./ruleset/games.mrs,              interval: 86400 }
  crypto:             { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/crypto.mrs",             path: ./ruleset/crypto.mrs,             interval: 86400 }
  ip-check:           { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/ip-check.mrs",           path: ./ruleset/ip-check.mrs,           interval: 86400 }
  vpndetect:          { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/vpndetect.mrs",          path: ./ruleset/vpndetect.mrs,          interval: 86400 }
  whitelist:          { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/whitelist.mrs",          path: ./ruleset/whitelist.mrs,          interval: 86400 }
  proxy-ip:           { type: http, behavior: ipcidr, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/proxy-ip.mrs",           path: ./ruleset/proxy-ip.mrs,           interval: 86400 }
  direct-ip:          { type: http, behavior: ipcidr, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/direct-ip.mrs",          path: ./ruleset/direct-ip.mrs,          interval: 86400 }
  refilter-domain:    { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/refilter-domain.mrs",    path: ./ruleset/refilter-domain.mrs,    interval: 86400 }
  refilter-ip:        { type: http, behavior: ipcidr, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/refilter-ip.mrs",        path: ./ruleset/refilter-ip.mrs,        interval: 86400 }
  refilter-community: { type: http, behavior: domain, format: mrs, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/refilter-community.mrs", path: ./ruleset/refilter-community.mrs, interval: 86400 }

  # === Inline: hand-curated overrides ===
  ru-custom-proxy:
    type: inline
    behavior: classical
    payload: []
    # examples:
    # - DOMAIN-SUFFIX,example.com
    # - DOMAIN-KEYWORD,somesite
  ru-custom-direct:
    type: inline
    behavior: classical
    payload: []
    # examples:
    # - DOMAIN-SUFFIX,mybank.ru
    # - DOMAIN-KEYWORD,internal

rules:
  # --- local & system ---
  - RULE-SET,direct-ip,DIRECT,no-resolve
  - IP-CIDR6,::/0,REJECT-DROP,no-resolve

  # --- ads & telemetry ---
  - RULE-SET,reject,REJECT-DROP

  # --- IP-probe & VPN-detect endpoints must report the real IP ---
  - RULE-SET,ip-check,DIRECT
  - RULE-SET,vpndetect,DIRECT

  # --- RU whitelist → direct (gov, banks, RU-only) — before refilter ---
  - RULE-SET,whitelist,DIRECT

  # --- user-controlled overrides ---
  - RULE-SET,ru-custom-direct,DIRECT
  - RULE-SET,ru-custom-proxy,VPN

  # --- proxied services with dedicated groups (order: specific → general) ---
  - RULE-SET,youtube,YouTube
  - RULE-SET,discord,Discord
  - RULE-SET,ai,AI
  - RULE-SET,crypto,Crypto

  # --- games (before proxy/direct to override both) ---
  - RULE-SET,games,Games

  # --- microsoft (before proxy/direct) ---
  - RULE-SET,microsoft,Microsoft

  # --- proxy: catch-all for RU-blocked domains (telegram/whatsapp/openai/…) ---
  - RULE-SET,proxy,VPN

  # --- RKN bypass, before the direct sets that would otherwise override ---
  - RULE-SET,refilter-domain,VPN
  - RULE-SET,refilter-community,VPN

  # --- direct: RU services + apple/microsoft/steam/twitch/xiaomi/… ---
  - RULE-SET,direct,DIRECT

  # --- remaining Russian TLDs → DIRECT ---
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,moscow,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,xn--p1acf,DIRECT
  - DOMAIN-SUFFIX,xn--80asehdb,DIRECT
  - DOMAIN-SUFFIX,xn--c1avg,DIRECT
  - DOMAIN-SUFFIX,xn--80aswg,DIRECT
  - DOMAIN-SUFFIX,xn--80adxhks,DIRECT
  - DOMAIN-SUFFIX,xn--d1acj3b,DIRECT

  # --- IP fallbacks ---
  - RULE-SET,proxy-ip,VPN,no-resolve
  - RULE-SET,refilter-ip,VPN,no-resolve

  # --- fallback: everything else → VPN ---
  - MATCH,VPN
