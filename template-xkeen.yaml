port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7893
allow-lan: true
mode: rule
log-level: silent
ipv6: false
unified-delay: true
tcp-concurrent: true
client-fingerprint: firefox
external-controller: 0.0.0.0:9090
#external-controller-unix: mihomo.sock
secret: admin
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip


profile:
  store-selected: true
  store-fake-ip: true



sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS:  { ports: [443, 8443] }
    QUIC: { ports: [443] }
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - fc00::/7
    - fe80::/10

proxy-providers:
  sub:
    type: http
    url: <SUBSCRIPTION_URL>
    path: ./proxy_providers/base64.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      tfo: true
      mptcp: true
      udp: true
    header:
      User-Agent:
        - "Mihomo"
      x-hwid:
        - "<SYSTEM_NAME>"
      x-device-os:
        - "xKeen"
      x-ver-os:
        - "XKeen 2.0"
      x-device-model:
        - "<MODEL_NAME>"
        
proxy-groups:
  - { name: 🚀 VPN, icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png", type: select, url: "https://cp.cloudflare.com/generate_204", include-all: true }

  - { name: ▶️ YouTube, icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png", type: select, remnawave: { include-proxies: false }, include-all: true, proxies: [🚀 VPN] }
  - { name: 🎧 Discord, icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png", type: select, remnawave: { include-proxies: false }, include-all: true, proxies: [🚀 VPN] }
  - { name: 🧠 AI, icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Dark/Bot.png", type: select, remnawave: { include-proxies: false }, include-all: true, proxies: [🚀 VPN] }
  - { name: 🕹️ Игры, icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png", type: select, remnawave: { include-proxies: false }, include-all: true, proxies: [🏠 DIRECT, 🚀 VPN] }
  # --- hidden ---
  - { name: PROXY, type: select, hidden: true, remnawave: { include-proxies: false }, proxies: [🚀 VPN] }
  - { name: 🏠 DIRECT, type: select, hidden: true, remnawave: { include-proxies: false }, proxies: [DIRECT] }

rule-providers:
  reject:       { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/reject.mrs", path: ./rs/reject.mrs }
  proxy:        { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/proxy.mrs", path: ./rs/proxy.mrs }
  discord:      { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/discord.mrs", path: ./rs/discord.mrs }
  ai:           { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/ai.mrs", path: ./rs/ai.mrs }
  youtube:      { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/youtube.mrs", path: ./rs/youtube.mrs }
  crypto:       { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/crypto.mrs", path: ./rs/crypto.mrs }
  ip-check:     { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/ip-check.mrs", path: ./rs/ip-check.mrs }
  games:        { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/games.mrs", path: ./rs/games.mrs }
  direct:       { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/direct.mrs", path: ./rs/direct.mrs }
  direct-ip:    { type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/direct-ip.mrs", path: ./rs/direct-ip.mrs }
  refilter-d:   { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/refilter-domain.mrs", path: ./rs/refilter-domain.mrs }
  refilter-ip:  { type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/refilter-ip.mrs", path: ./rs/refilter-ip.mrs }
  ru-ip:        { type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/ru-ip.mrs", path: ./rs/ru-ip.mrs }
  proxy-ip:     { type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://raw.githubusercontent.com/magiasegura/routing-public/main/release/proxy-ip.mrs", path: ./rs/proxy-ip.mrs }

rules:
  # --- local & system ---
  - RULE-SET,direct-ip,DIRECT,no-resolve
  - IP-CIDR,::/0,REJECT-DROP,no-resolve
  # --- ads & telemetry ---
  - RULE-SET,reject,REJECT-DROP
  # --- proxied services ---
  - RULE-SET,proxy,🚀 VPN
  - RULE-SET,ai,🧠 AI
  - RULE-SET,youtube,▶️ YouTube
  - RULE-SET,discord,🎧 Discord
  - RULE-SET,crypto,🚀 VPN
  # --- IP-probe endpoints must report the real IP ---
  # (after the proxied services: upstream lists gstatic.com here)
  - RULE-SET,ip-check,DIRECT
  # --- RKN bypass, before the direct sets it has to override ---
  - RULE-SET,refilter-d,🚀 VPN
  # --- games & direct services ---
  - RULE-SET,games,🕹️ Игры
  - RULE-SET,direct,DIRECT
  # --- remaining Russian TLDs ---
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,moscow,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,xn--p1acf,DIRECT
  - DOMAIN-SUFFIX,xn--80asehdb,DIRECT
  - DOMAIN-SUFFIX,xn--c1avg,DIRECT
  - DOMAIN-SUFFIX,xn--80aswg,DIRECT
  - DOMAIN-SUFFIX,xn--80adxhks,DIRECT
  - DOMAIN-SUFFIX,xn--d1acj3b,DIRECT
  # --- IP fallbacks ---
  - RULE-SET,proxy-ip,🚀 VPN,no-resolve
  - RULE-SET,refilter-ip,🚀 VPN,no-resolve
  - RULE-SET,ru-ip,DIRECT,no-resolve
  # --- everything else ---
  - MATCH,🚀 VPN
  
dns:
  listen: 0.0.0.0:53
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:direct
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "time.*.com"
    - "time.*.gov"
    - "+.pool.ntp.org"
    - "+.stun.*"
    - "stun.*"
  default-nameserver: [1.1.1.1, 8.8.8.8]
  proxy-server-nameserver: [1.1.1.1, 8.8.8.8]
  direct-nameserver:
    - https://common.dns.yandex.net/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query#PROXY  